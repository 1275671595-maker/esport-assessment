      <div class="stat-card"><div class="stat-icon" style="background:var(--warning-bg);color:var(--warning)">📥</div><div class="stat-info"><div class="stat-value">${pendingBookings.length}</div><div class="stat-label">待接订单</div></div></div>
      ${isSuper ? `<div class="stat-card"><div class="stat-icon" style="background:var(--info-bg);color:var(--info)">📦</div><div class="stat-info"><div class="stat-value">${transferCount}</div><div class="stat-label">平移单</div></div></div>` : ''}
      <div class="stat-card"><div class="stat-icon" style="background:var(--primary-bg);color:var(--primary)">🎯</div><div class="stat-info"><div class="stat-value">${myActive.length}</div><div class="stat-label">进行中</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:var(--success-bg);color:var(--success)">🏆</div><div class="stat-info"><div class="stat-value">${myDone.length}</div><div class="stat-label">已完成</div></div></div>
    </div>
    <div class="tabs">
      <button class="tab ${state.currentTab==='hall'?'active':''}" onclick="setTab('hall')">🏪 接单大厅 <span class="count">${pendingBookings.length}</span></button>
      ${isSuper ? `<button class="tab ${state.currentTab==='transfer'?'active':''}" onclick="setTab('transfer')">📦 平移单 <span class="count">${transferCount}</span></button>` : ''}
      <button class="tab ${state.currentTab==='mine'?'active':''}" onclick="setTab('mine')">🎯 我的考核 <span class="count">${myActive.length}</span></button>
      <button class="tab ${state.currentTab==='history'?'active':''}" onclick="setTab('history')">📜 历史记录 <span class="count">${myDone.length}</span></button>
      ${isSuper ? `<button class="tab ${state.currentTab==='dashboard'?'active':''}" onclick="setTab('dashboard')">📊 数据看板</button>` : ''}
    </div>
    ${state.currentTab === 'hall' ? renderHall(pendingBookings) : ''}
    ${state.currentTab === 'transfer' && isSuper ? renderTransferHall() : ''}
    ${state.currentTab === 'mine' ? renderMyActive(myActive) : ''}
    ${state.currentTab === 'history' ? renderHistory(myDone) : ''}
    ${state.currentTab === 'dashboard' && isSuper ? renderDashboard() : ''}
  `;
}

function renderTransferHall() {
  const transfers = state.bookings.filter(b => (b.type || 'normal') === 'transfer' && b.status === 'pending').sort((a, b) => new Date(a.preferredTime).getTime() - new Date(b.preferredTime).getTime());
  if (transfers.length === 0) return `<div class="empty-state"><div class="empty-icon">📦</div><h3>暂无平移单</h3><p>考生提交平移登记后会显示在这里</p></div>`;
  return `<div class="cards-grid">${transfers.map(b => renderBookingCard(b, true)).join('')}</div>`;
}

// ========== Dashboard (10424 only) ==========
function renderDashboard() {
  const all = state.bookings;
  const normal = all.filter(b => (b.type || 'normal') === 'normal');
  const transfers = all.filter(b => (b.type || 'normal') === 'transfer');
  const completed = all.filter(b => b.status === 'completed');
  const passed = completed.filter(b => b.passed === true).length;
  const failed = completed.filter(b => b.passed === false).length;

  // Time period distribution (by preferredTime day)
  const byDay = {};
  normal.forEach(b => {
    const d = b.preferredTime ? b.preferredTime.slice(0, 10) : '未定';
    byDay[d] = (byDay[d] || 0) + 1;
  });
  const dayEntries = Object.entries(byDay).sort((a, b) => a[0].localeCompare(b[0]));
  const maxDay = Math.max(1, ...dayEntries.map(e => e[1]));

  // Assessment tier distribution (companion)
  const byTier = { 1: 0, 2: 0, 3: 0, 4: 0, 0: 0 };
  normal.forEach(b => { byTier[b.assessmentTier || 0] = (byTier[b.assessmentTier || 0] || 0) + 1; });

  // Gender ratio
  const male = normal.filter(b => b.gender === 'male').length;
  const female = normal.filter(b => b.gender === 'female').length;

  // Examiner load
  const examinerCount = {};
  completed.forEach(b => {
    if (b.examinerName) examinerCount[b.examinerName] = (examinerCount[b.examinerName] || 0) + 1;
  });
  const examinerEntries = Object.entries(examinerCount).sort((a, b) => b[1] - a[1]);

  return `
    <div class="dashboard">
      <h2 style="margin-bottom:20px;">📊 数据看板</h2>

      <!-- Top stats -->
      <div class="dash-stats">
        <div class="dash-stat"><div class="dash-num">${all.length}</div><div class="dash-label">总预约数</div></div>
        <div class="dash-stat"><div class="dash-num" style="color:var(--info)">${normal.length}</div><div class="dash-label">正常考核</div></div>
        <div class="dash-stat"><div class="dash-num" style="color:var(--success)">${transfers.length}</div><div class="dash-label">平移登记</div></div>
        <div class="dash-stat"><div class="dash-num" style="color:var(--success)">${passed}</div><div class="dash-label">已通过</div></div>
        <div class="dash-stat"><div class="dash-num" style="color:var(--danger)">${failed}</div><div class="dash-label">未通过</div></div>
        <div class="dash-stat"><div class="dash-num">${completed.length > 0 ? Math.round(passed / completed.length * 100) : 0}%</div><div class="dash-label">通过率</div></div>
      </div>

      <div class="dash-grid">
        <!-- Time distribution -->
        <div class="dash-card">
          <h3>📅 时间段分布</h3>
          ${dayEntries.length === 0 ? '<div class="empty-tip">暂无数据</div>' : `
            <div class="bar-chart">
              ${dayEntries.map(([d, c]) => `
                <div class="bar-row">
                  <div class="bar-label">${d.slice(5)}</div>
                  <div class="bar-track"><div class="bar-fill" style="width:${c / maxDay * 100}%;background:var(--info)"></div></div>
                  <div class="bar-value">${c}</div>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <!-- Assessment tier -->
        <div class="dash-card">
          <h3>🎯 考核档位分布</h3>
          <div class="bar-chart">
            <div class="bar-row"><div class="bar-label">一档</div><div class="bar-track"><div class="bar-fill" style="width:${byTier[1] / Math.max(1, normal.length) * 100}%;background:var(--primary)"></div></div><div class="bar-value">${byTier[1]}</div></div>
            <div class="bar-row"><div class="bar-label">二档</div><div class="bar-track"><div class="bar-fill" style="width:${byTier[2] / Math.max(1, normal.length) * 100}%;background:var(--info)"></div></div><div class="bar-value">${byTier[2]}</div></div>
            <div class="bar-row"><div class="bar-label">三档</div><div class="bar-track"><div class="bar-fill" style="width:${byTier[3] / Math.max(1, normal.length) * 100}%;background:var(--warning)"></div></div><div class="bar-value">${byTier[3]}</div></div>
            <div class="bar-row"><div class="bar-label">四档</div><div class="bar-track"><div class="bar-fill" style="width:${byTier[4] / Math.max(1, normal.length) * 100}%;background:var(--danger)"></div></div><div class="bar-value">${byTier[4]}</div></div>
            <div class="bar-row"><div class="bar-label">娱乐</div><div class="bar-track"><div class="bar-fill" style="width:${byTier[0] / Math.max(1, normal.length) * 100}%;background:var(--text-muted)"></div></div><div class="bar-value">${byTier[0]}</div></div>
          </div>
        </div>

        <!-- Gender ratio -->
        <div class="dash-card">
          <h3>👥 男女比例</h3>
          <div class="ratio-display">
            <div class="ratio-bar">
              <div class="ratio-male" style="width:${(male + female) > 0 ? male / (male + female) * 100 : 0}%"></div>
              <div class="ratio-female" style="width:${(male + female) > 0 ? female / (male + female) * 100 : 0}%"></div>
            </div>
            <div class="ratio-legend">
              <div><span style="color:var(--info)">●</span> 男: ${male} (${(male + female) > 0 ? Math.round(male / (male + female) * 100) : 0}%)</div>
              <div><span style="color:var(--danger)">●</span> 女: ${female} (${(male + female) > 0 ? Math.round(female / (male + female) * 100) : 0}%)</div>
            </div>
          </div>
        </div>

        <!-- Examiner load -->
        <div class="dash-card">
          <h3>👨‍🏫 各考官接单数</h3>
          ${examinerEntries.length === 0 ? '<div class="empty-tip">暂无数据</div>' : `
            <div class="bar-chart">
              ${examinerEntries.map(([name, count]) => `
                <div class="bar-row">
                  <div class="bar-label">${name}</div>
                  <div class="bar-track"><div class="bar-fill" style="width:${count / Math.max(...examinerEntries.map(e => e[1])) * 100}%;background:var(--success)"></div></div>
                  <div class="bar-value">${count}</div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      </div>
    </div>
  `;
}

function renderHall(bookings) {
  return `
    ${bookings.length === 0 ? `<div class="empty-state"><div class="empty-icon">🎯</div><h3>暂无可接订单</h3><p>目前没有待接单的考核预约，请稍后再来</p></div>` : `<div class="cards-grid">${bookings.map(b => renderBookingCard(b, true)).join('')}</div>`}
  `;
}

function renderMyActive(bookings) {
  if (bookings.length === 0) return `<div class="empty-state"><div class="empty-icon">🎮</div><h3>暂无进行中的考核</h3><p>前往接单大厅查看可接订单</p><button class="btn btn-primary" style="margin-top:16px" onclick="setTab('hall')">🏪 前往接单大厅</button></div>`;
  return `<div class="cards-grid">${bookings.map(b => renderBookingCard(b, false, true)).join('')}</div>`;
}

function renderHistory(bookings) {
  if (bookings.length === 0) return `<div class="empty-state"><div class="empty-icon">📜</div><h3>暂无历史记录</h3><p>完成的考核将显示在这里</p></div>`;
  return `<div class="cards-grid">${bookings.map(renderBookingCard).join('')}</div>`;
}

// ========== Booking Card ==========
function renderBookingCard(b, canAccept, canManage) {
  const game = GAMES[b.game];
  const status = STATUS[b.status];
  const isExaminee = state.session.role === 'examinee';
  const isMyExaminer = b.examinerContact === state.session.username;

  // Build tags
  let tags = `<span class="game-tag ${game.color}">${game.icon} ${game.name}</span>`;
  if ((b.type || 'normal') === 'transfer') tags += `<span class="assess-tag" style="background:rgba(16,185,129,.15);color:var(--success);border:1px solid rgba(16,185,129,.3)">📦 平移单</span>`;
  if (b.transferredCount > 0) tags += `<span class="assess-tag" style="background:rgba(245,158,11,.15);color:var(--warning);border:1px solid rgba(245,158,11,.3)">🔄 转单${b.transferredCount > 1 ? '×' + b.transferredCount : ''}</span>`;
  if (b.assessmentType) {
    const cfg = DELTA_CRITERIA[b.assessmentType];
    tags += `<span class="assess-tag ${b.assessmentType}">${cfg.icon} ${cfg.shortLabel}</span>`;
    if (b.assessmentMode) tags += `<span class="assess-tag mode">${b.assessmentMode === 'single' ? '单考' : '双考'}</span>`;
    if (b.assessmentTier) {
      const tierNames = ['', '一档', '二档', '三档', '四档'];
      tags += `<span class="assess-tag tier">${tierNames[b.assessmentTier]}</span>`;
    }
  }
  if (b.gender) tags += `<span class="gender-tag">${b.gender === 'male' ? '👨 男' : '👩 女'}</span>`;
  if (b.platform) tags += `<span class="platform-tag">${b.platform === 'pc' ? '🖥️ 端游' : '📱 手游'}</span>`;

  let actions = '';
  if (canAccept && b.status === 'pending') {
    actions = `<button class="btn btn-success btn-sm" onclick="acceptBooking('${b.id}')">✓ 接单</button><button class="btn btn-outline btn-sm" onclick="viewDetail('${b.id}')">详情</button>`;
  }
  if (canManage && isMyExaminer) {
    if (b.status === 'accepted') actions = `<button class="btn btn-primary btn-sm" onclick="startAssessing('${b.id}')">开始考核</button><button class="btn btn-outline btn-sm" style="color:var(--warning);border-color:var(--warning)" onclick="transferBooking('${b.id}')">🔄 转单</button><button class="btn btn-outline btn-sm" onclick="viewDetail('${b.id}')">详情</button>`;
    else if (b.status === 'assessing') actions = `<button class="btn btn-success btn-sm" onclick="showAssessForm('${b.id}')">完成考核</button><button class="btn btn-outline btn-sm" style="color:var(--warning);border-color:var(--warning)" onclick="transferBooking('${b.id}')">🔄 转单</button><button class="btn btn-outline btn-sm" onclick="viewDetail('${b.id}')">详情</button>`;
  }
  if (isExaminee && b.status === 'pending') {
    actions = `<button class="btn btn-danger btn-sm" onclick="cancelBooking('${b.id}')">取消预约</button><button class="btn btn-outline btn-sm" onclick="viewDetail('${b.id}')">详情</button>`;
  }
  if (b.status === 'completed' && !actions) actions = `<button class="btn btn-outline btn-sm" onclick="viewDetail('${b.id}')">查看详情</button>`;
  if (b.status === 'cancelled' && !actions) actions = `<button class="btn btn-outline btn-sm" onclick="viewDetail('${b.id}')">详情</button>`;

  return `
    <div class="booking-card${(b.transferredCount > 0 && b.status === 'pending') ? ' transferred' : ''}${(b.type || 'normal') === 'transfer' ? ' transfer-card' : ''}">
      <div class="card-top">
        <div class="card-tags">${tags}</div>
        <span class="status-badge ${status.class}">${status.label}</span>
      </div>
      <div class="card-body">
        <div class="info-row"><span class="label">考生</span><span class="value">${b.examineeName}</span></div>
        <div class="info-row"><span class="label">微信号</span><span class="value">${b.wechat || '--'}</span></div>
        ${b.seasonRank ? `<div class="info-row"><span class="label">赛季段位</span><span class="value">${b.seasonRank}</span></div>` : ''}
        ${b.kd ? `<div class="info-row"><span class="label">KD</span><span class="value">${b.kd}</span></div>` : ''}
        <div class="info-row"><span class="label">期望时间</span><span class="value">${fmtFullTime(new Date(b.preferredTime).getTime())}</span></div>
        ${b.examinerName ? `<div class="info-row"><span class="label">考官</span><span class="value">${b.examinerName}</span></div>` : ''}
        ${b.examinerName && isExaminee ? `<div class="info-row" style="align-items:flex-start;"><span class="label">考官二维码</span><span class="value" id="cardQr_${b.id}"><span style="font-size:.82rem;color:var(--text-muted);">加载中...</span></span></div>` : ''}
        ${b.status === 'completed' && b.passed !== null && b.passed !== undefined ? `<div class="info-row"><span class="label">考核结果</span><span class="value"><span class="result-badge ${b.passed ? 'pass' : 'fail'}">${b.passed ? '✅ 通过' : '❌ 未通过'}</span></span></div>` : ''}
        ${b.score !== null ? `<div class="info-row"><span class="label">评分</span><span class="value">${renderScoreDisplay(b.score)}</span></div>` : ''}
        ${b.notes ? `<div class="card-notes">💬 ${b.notes}</div>` : ''}
      </div>
      <div class="card-footer">
        <span class="card-time">${timeAgo(b.createdAt)}</span>
        <div class="card-actions">${actions}</div>
      </div>
    </div>
  `;
}

function renderScoreDisplay(score) {
  const full = '\u2605'.repeat(score);
  const empty = '\u2605'.repeat(5 - score);
  return `<span class="score-display"><span class="score-stars">${full}<span class="empty">${empty}</span></span><span class="score-value">${score}/5</span></span>`;
}

function viewMaterialImage(src) {
  showModal(`
    <div class="modal-header">
      <h3>证明资料</h3>
      <button class="modal-close" onclick="closeModal()">\u00d7</button>
    </div>
    <div class="modal-body" style="text-align:center;">
      <img src="${src}" style="max-width:100%;max-height:80vh;border-radius:8px;" />
    </div>
  `);
}

// ========== Actions ==========
function setTab(tab) { state.currentTab = tab; render(); }
function setFilter(game) { state.filterGame = game; render(); }

function acceptBooking(id) {
  const b = state.bookings.find(x => x.id === id);
  if (!b) return;
  if (b.status !== 'pending') { toast('该订单已被接取', 'warning'); return; }
  showConfirm(`确认接取 ${b.examineeName} 的 ${GAMES[b.game].name} 考核订单？`, async () => {
    try {
      await actionBooking(id, 'accept', { examinerName: state.session.username, examinerContact: state.session.username });
      toast('接单成功！', 'success');
      await refreshAfterAction();
    } catch (e) {
      toast('接单失败：' + e.message, 'error');
    }
  });
}

async function startAssessing(id) {
  try {
    await actionBooking(id, 'start');
    toast('考核已开始，请完成考核后提交评分', 'info');
    await refreshAfterAction();
  } catch (e) {
    toast('操作失败：' + e.message, 'error');
  }
}

function showAssessForm(id) {
  const b = state.bookings.find(x => x.id === id);
  if (!b) return;
  state.editingScore = 0;
  state.editingPassed = null;
  const criteria = getCriteriaForBooking(b);
  const criteriaHtml = criteria ? `
    <div class="detail-section" style="background:var(--primary-bg);">
      <h4 style="color:var(--primary-dark);">📋 考核标准参考</h4>
      ${criteria.accountReq ? `<div style="font-size:.82rem;color:var(--primary-dark);margin-bottom:8px;">账号要求：${criteria.accountReq}</div>` : ''}
      <div class="criteria-checklist">
        ${criteria.checklist.map(item => `<div class="criteria-item"><span class="ci-icon">\u2713</span><span>${item}</span></div>`).join('')}
      </div>
      ${criteria.note ? `<div class="criteria-note">⚠️ ${criteria.note}</div>` : ''}
    </div>
    ${b.game === 'delta' && b.assessmentType ? renderPrecautionsHtml() : ''}
  ` : '';

  showModal(`
    <div class="modal-header">
      <h3>提交考核评价</h3>
      <button class="modal-close" onclick="closeModal()">\u00d7</button>
    </div>
    <div class="modal-body">
      ${criteriaHtml}
      <div class="form-group">
        <label class="form-label">考核结果 <span class="required">*</span></label>
        <div class="pass-fail-selector">
          <div class="pass-fail-btn pass" id="passBtn" onclick="setPassed(true)">✅ 考核通过</div>
          <div class="pass-fail-btn fail" id="failBtn" onclick="setPassed(false)">❌ 未通过</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">考核评分</label>
        <div class="star-rating" id="starRating">
          ${[1,2,3,4,5].map(n => `<span class="star" data-score="${n}" onclick="setScore(${n})" onmouseover="hoverScore(${n})" onmouseout="resetHover()">\u2605</span>`).join('')}
        </div>
        <div class="form-hint" id="scoreHint">请选择评分（选填）</div>
      </div>
      <div class="form-group">
        <label class="form-label">考核反馈</label>
        <textarea class="form-textarea" id="feedbackInput" placeholder="对考生的操作、意识、配合、沟通等方面进行评价（选填）" style="min-height:120px" maxlength="1000"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-success" onclick="submitAssessment('${id}')">提交评价</button>
    </div>
  `);
}

function setScore(n) {
  state.editingScore = n;
  document.querySelectorAll('#starRating .star').forEach(el => { el.classList.toggle('active', parseInt(el.dataset.score) <= n); });
  const hints = ['', '不合格 - 需大幅提升', '及格 - 基本达标，有提升空间', '良好 - 操作意识不错', '优秀 - 表现出色', '卓越 - 顶尖水平'];
  document.getElementById('scoreHint').textContent = hints[n] || '请选择评分';
}
function hoverScore(n) { document.querySelectorAll('#starRating .star').forEach(el => { el.classList.toggle('hover', parseInt(el.dataset.score) <= n); }); }
function resetHover() { document.querySelectorAll('#starRating .star').forEach(el => { el.classList.toggle('active', parseInt(el.dataset.score) <= state.editingScore); el.classList.remove('hover'); }); }

async function submitAssessment(id) {
  if (state.editingPassed === null) { toast('请选择考核结果（通过/未通过）', 'error'); return; }
  const feedback = document.getElementById('feedbackInput').value.trim();
  const score = state.editingScore > 0 ? state.editingScore : null;
  try {
    await actionBooking(id, 'complete', { score, feedback, passed: state.editingPassed });
    closeModal();
    toast('考核评价已提交！', 'success');
    await refreshAfterAction();
  } catch (e) {
    toast('提交失败：' + e.message, 'error');
  }
}

function setPassed(passed) {
  state.editingPassed = passed;
  document.getElementById('passBtn').classList.toggle('selected', passed === true);
  document.getElementById('failBtn').classList.toggle('selected', passed === false);
}

function cancelBooking(id) {
  const b = state.bookings.find(x => x.id === id);
  if (!b) return;
  showConfirm(`确认取消预约 ${b.id}？取消后无法恢复。`, async () => {
    try {
      await actionBooking(id, 'cancel');
      toast('预约已取消', 'info');
      await refreshAfterAction();
    } catch (e) {
      toast('取消失败：' + e.message, 'error');
    }
  });
}

function transferBooking(id) {
  const b = state.bookings.find(x => x.id === id);
  if (!b) return;
  showConfirm(`确认转单？转单后该预约将重新回到接单大厅，供其他考官接取。`, async () => {
    try {
      await actionBooking(id, 'transfer');
      toast('已转单，预约已回到接单大厅', 'info');
      await refreshAfterAction();
    } catch (e) {
      toast('转单失败：' + e.message, 'error');
    }
  });
}

// ========== Detail View ==========
function viewDetail(id) {
  const b = state.bookings.find(x => x.id === id);
  if (!b) return;
  const game = GAMES[b.game];
  const status = STATUS[b.status];
  const criteria = getCriteriaForBooking(b);

  // Build tags
  let tagsHtml = `<span class="game-tag ${game.color}">${game.icon} ${game.name}</span>`;
  if (b.assessmentType) {
    const cfg = DELTA_CRITERIA[b.assessmentType];

// ========== Modal ==========
function showModal(html, large) {
  let overlay = document.getElementById('modalOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'modalOverlay';
    overlay.className = 'modal-overlay';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  }
  overlay.innerHTML = `<div class="modal ${large ? 'large' : ''}">${html}</div>`;
  overlay.classList.add('show');
}
function closeModal() {
  const overlay = document.getElementById('modalOverlay');
  if (overlay) { overlay.classList.remove('show'); setTimeout(() => overlay.remove(), 200); }
}
function showConfirm(msg, onConfirm) {
  showModal(`
    <div class="modal-header"><h3>确认操作</h3></div>
    <div class="modal-body"><p style="font-size:.95rem;color:var(--text);">${msg}</p></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="confirmAction()">确认</button>
    </div>
  `);
  window._confirmAction = onConfirm;
}
function confirmAction() { closeModal(); if (window._confirmAction) { window._confirmAction(); window._confirmAction = null; } }
